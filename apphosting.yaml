# Configuração do Firebase App Hosting. O deploy envia o monorepo inteiro (web
# depende de shared). O buildpack não entende npm workspaces, então build e
# start rodam dentro de web/, que resolve @natal/shared via file:../shared.
# Os valores do app web do Firebase são públicos (vão para o navegador); a
# proteção vem das regras do Firestore e do App Check.
scripts:
  buildCommand: cd web && npm install --no-audit --no-fund --include=dev && npm run build
  runCommand: npm --prefix web run start

runConfig:
  minInstances: 0
  maxInstances: 2

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyArXtGpcNxhOTEtGSZe0QZfOq1WzAb4-H0
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: grupo-natal-solidario.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: grupo-natal-solidario
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: grupo-natal-solidario.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:371128008347:web:f9aeda546cce541baa503e
    availability: [BUILD, RUNTIME]
  # Chave do site reCAPTCHA Enterprise usada pelo App Check (pública).
  - variable: NEXT_PUBLIC_RECAPTCHA_KEY
    value: 6Lc_m_gtAAAAADjhEfzDuHxLnAhZyMx-EsFgkoC-
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIRESTORE_DATABASE
    value: natalsolidario
    availability: [BUILD, RUNTIME]
